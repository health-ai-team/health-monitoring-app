name: Deploy to FreeBUF

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build project
        run: npm run build || echo "No build script found"
      
      - name: Deploy to FreeBUF
        env:
          FREE_BUF_TOKEN: ${{ secrets.FREE_BUF_TOKEN }}
        run: |
          echo "🚀 Deploying to FreeBUF..."
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          # Replace the line below with your actual FreeBUF deployment command
          echo "✅ Deployment completed successfully!"
